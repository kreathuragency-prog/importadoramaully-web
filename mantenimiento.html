<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>En Mantención | Importadora Maully</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="robots" content="noindex, nofollow">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  /* ── Video Background ── */
  #yt-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    background: #0a0a1a;
  }

  #yt-bg iframe {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    /* 16:9 — oversized so it always covers the viewport */
    width: 100vw;
    height: 56.25vw; /* 16:9 */
    min-height: 100vh;
    min-width: 177.78vh; /* 16:9 inverse */
  }

  /* Thumbnail fallback — shown until iframe fires */
  #yt-thumb {
    position: absolute;
    inset: 0;
    background-image: url('https://img.youtube.com/vi/69tTk6rJ6RI/maxresdefault.jpg');
    background-size: cover;
    background-position: center;
    transition: opacity 1.2s ease;
  }

  /* Dark overlay */
  #overlay {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: linear-gradient(
      160deg,
      rgba(10, 10, 26, 0.72) 0%,
      rgba(10, 10, 26, 0.60) 50%,
      rgba(10, 10, 26, 0.78) 100%
    );
  }

  /* ── Content ── */
  #content {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    gap: 0;
  }

  .logo-wrap {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 36px;
  }

  .logo-m {
    width: 56px; height: 56px;
    border-radius: 14px;
    background: linear-gradient(135deg, #d4af37, #b8960c);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.9rem; font-weight: 900;
    color: #0a0a1a;
    box-shadow: 0 4px 20px rgba(212,175,55,0.35);
    flex-shrink: 0;
  }

  .logo-text {
    text-align: left;
    line-height: 1.15;
  }

  .logo-text span {
    display: block;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
  }

  .logo-text strong {
    display: block;
    font-size: 1.35rem;
    font-weight: 800;
    color: #fff;
    letter-spacing: 0.04em;
  }

  /* Gear icon animated */
  .gear-wrap {
    margin-bottom: 28px;
  }

  .gear-wrap svg {
    width: 64px; height: 64px;
    animation: spin 8s linear infinite;
    color: #d4af37;
    filter: drop-shadow(0 0 16px rgba(212,175,55,0.5));
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  h1 {
    font-size: clamp(1.5rem, 4vw, 2.4rem);
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.01em;
    line-height: 1.2;
    margin-bottom: 16px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.4);
  }

  p.sub {
    font-size: clamp(0.95rem, 2.2vw, 1.15rem);
    color: rgba(255,255,255,0.72);
    max-width: 460px;
    line-height: 1.65;
    margin-bottom: 40px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.3);
  }

  /* WhatsApp CTA */
  .wa-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #25D366;
    color: #fff;
    text-decoration: none;
    font-size: 1rem;
    font-weight: 700;
    padding: 14px 28px;
    border-radius: 50px;
    box-shadow: 0 6px 24px rgba(37,211,102,0.38);
    transition: transform 0.18s, box-shadow 0.18s;
    letter-spacing: 0.01em;
  }

  .wa-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 32px rgba(37,211,102,0.48);
  }

  .wa-btn svg {
    width: 22px; height: 22px;
    flex-shrink: 0;
  }

  /* Progress dots */
  .dots {
    display: flex;
    gap: 8px;
    margin-top: 44px;
  }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    animation: pulse 1.6s ease-in-out infinite;
  }

  .dot:nth-child(2) { animation-delay: 0.28s; }
  .dot:nth-child(3) { animation-delay: 0.56s; }

  @keyframes pulse {
    0%, 100% { background: rgba(255,255,255,0.2); transform: scale(1); }
    50%       { background: #d4af37; transform: scale(1.35); }
  }

  /* Footer */
  footer {
    position: fixed;
    bottom: 18px;
    left: 0; right: 0;
    z-index: 2;
    text-align: center;
    font-size: 0.72rem;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.05em;
  }
</style>
</head>
